<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Amount Detector</title>
  <link rel="stylesheet" href="style.css">
  <!-- jsQR library for decoding QR codes from image data -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>

  <div class="card">
    <h2>Scan / Upload Bank QR</h2>
    <p class="subtitle">Upload a payment QR code to auto-detect the amount</p>

    <!-- Upload Area -->
    <div class="upload-area" id="upload-box">
      <input type="file" id="qr-input" accept="image/*" hidden>
      <div class="upload-content">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>Click or drag & drop QR image here</p>
      </div>
      <img id="preview-img" alt="QR Code Preview" hidden />
    </div>

    <!-- Status / Feedback Message -->
    <div id="status-msg" class="status-msg hidden"></div>

    <!-- Payment Form -->
    <div class="form-group">
      <label for="amount">Detected Amount</label>
      <div class="input-wrapper">
        <span class="currency-symbol" id="currency-symbol">$</span>
        <input type="number" id="amount" placeholder="0.00" step="0.01" readonly>
      </div>
    </div>

    <div class="form-group">
      <label for="raw-data">Raw QR Data</label>
      <textarea id="raw-data" rows="3" readonly placeholder="QR raw string will appear here..."></textarea>
    </div>

    <button id="reset-btn" class="btn-reset">Reset / Upload Another</button>
  </div>

  <canvas id="qr-canvas" hidden></canvas>
  <script src="script.js"></script>
</body>
</html>
