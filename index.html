<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank QR Detector & Scanner</title>
  <link rel="stylesheet" href="style.css">
  <!-- jsQR library for parsing QR frame data -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>

  <div class="card">
    <h2>Bank QR Payment</h2>
    <p class="subtitle">Scan via Camera or Upload QR Image</p>

    <!-- Mode Selector Tabs -->
    <div class="tab-group">
      <button id="tab-upload" class="tab-btn active">Upload File</button>
      <button id="tab-camera" class="tab-btn">Live Scan</button>
    </div>

    <!-- Upload Section -->
    <div id="upload-section" class="view-section">
      <div class="upload-area" id="upload-box">
        <input type="file" id="qr-input" accept="image/*" hidden>
        <div class="upload-content">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <p>Click or drag & drop QR image here</p>
        </div>
        <img id="preview-img" alt="QR Preview" hidden />
      </div>
    </div>

    <!-- Live Camera Scanner Section -->
    <div id="camera-section" class="view-section hidden">
      <div class="camera-wrapper">
        <video id="webcam" playsinline></video>
        <div class="scanner-overlay">
          <div class="scan-box"></div>
        </div>
      </div>
    </div>

    <!-- Feedback / Status -->
    <div id="status-msg" class="status-msg hidden"></div>

    <!-- Extracted Payment Details -->
    <div class="form-group">
      <label for="amount">Detected Amount</label>
      <div class="input-wrapper">
        <span class="currency-symbol" id="currency-symbol">$</span>
        <input type="number" id="amount" placeholder="0.00" step="0.01" readonly>
      </div>
    </div>

    <div class="form-group">
      <label for="merchant-name">Merchant / Receiver</label>
      <input type="text" id="merchant-name" placeholder="Unknown Receiver" readonly>
    </div>

    <div class="form-group">
      <label for="raw-data">Raw EMVCo Payload</label>
      <textarea id="raw-data" rows="2" readonly placeholder="EMVCo string will display here..."></textarea>
    </div>

    <!-- Action Controls Row with Enhanced Styles -->
    <div class="action-controls-row">
        <button id="reset-btn" class="btn-secondary-reset">
            <span>🔄</span> Reset / សម្អាត
        </button>
        <button id="pay-btn" class="btn-primary-pay">
            <span>💳</span> Confirm Payment / បញ្ជាក់ការទូទាត់
        </button>
    </div>
    
  <canvas id="qr-canvas" hidden></canvas>
  <script src="script.js"></script>
</body>
</html>
